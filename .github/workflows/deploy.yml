name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to roll back to (e.g. v2.0.1). Blank deploys the selected branch.'
        required: false
        type: string
      force_across_migrations:
        description: 'DANGEROUS: deploy even if the DB schema is ahead of the target tag'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Format-checked before checkout so a typo can't resolve to a branch.
      - name: Validate the rollback tag
        if: inputs.tag != ''
        run: |
          set -euo pipefail
          if ! printf '%s' "${{ inputs.tag }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${{ inputs.tag }}' is not a release tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # Proves we're on the annotated release tag itself, not a branch or SHA
      # that happens to answer to the same name.
      - name: Confirm the checkout is that tag
        if: inputs.tag != ''
        run: |
          set -euo pipefail
          tagged=$(git rev-parse --verify "refs/tags/${{ inputs.tag }}^{commit}")
          head=$(git rev-parse --verify HEAD)
          if [ "$tagged" != "$head" ]; then
            echo "::error::HEAD ($head) is not ${{ inputs.tag }} ($tagged)"
            exit 1
          fi
          echo "rolling back to ${{ inputs.tag }} at $head"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

      # Versioning is push-only: a manual workflow_dispatch redeploys the
      # checked-out tree as-is, without minting a version or a release.
      - name: Compute release version
        id: release
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          version=$(
            LATEST_TAG="$latest" \
            SUBJECT="$(git log -1 --format=%s "$GITHUB_SHA")" \
            BODY="$(git log -1 --format=%b "$GITHUB_SHA")" \
            FALLBACK="$(node -p "require('./package.json').version")" \
            npx tsx scripts/nextVersion.ts
          )
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists — refusing to reuse a released version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "${latest:-<no tags>} -> v$version"

      # Workspace-only: package.json in the repo is never updated. Tags are the
      # sole source of truth, so the version is derived on the way out rather
      # than mirrored back into main.
      - name: Stamp the version into the artifact
        if: steps.release.outputs.version != ''
        run: npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version

      # Rolling back re-derives the version from the tag for the same reason:
      # the tag name is authoritative, the committed package.json is not.
      - name: Stamp the rollback version into the artifact
        if: inputs.tag != ''
        run: npm version "${{ inputs.tag }}" --no-git-tag-version --allow-same-version

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # Runs before anything mutates the box, so a refused rollback leaves the
      # bot running untouched. Drizzle only ever compares against the highest
      # applied created_at, so a target tag behind that value would boot old
      # code against a newer schema and apply nothing — silently.
      - name: Check migration state against the target tag
        if: inputs.tag != ''
        run: |
          set -euo pipefail

          if [ -f drizzle/meta/_journal.json ]; then
            target=$(node -e 'const j=require("./drizzle/meta/_journal.json");const w=(j.entries||[]).map(e=>e.when).filter(n=>Number.isSafeInteger(n));process.stdout.write(w.length?String(Math.max(...w)):"")')
          else
            target=""
          fi

          applied=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          APP="${{ secrets.DEPLOY_PATH }}"
          cd "$APP"
          rel=$(grep -E '^DB_PATH=' .env 2>/dev/null | tail -1 | cut -d= -f2- || true)
          rel=${rel:-.data/feed1.sqlite}
          case "$rel" in /*) db="$rel" ;; *) db="$APP/$rel" ;; esac
          [ -f "$db" ] || exit 0
          node -e 'const D=require("better-sqlite3");const s=new D(process.argv[1],{readonly:true});const t=s.prepare("select name from sqlite_master where type=? and name=?").get("table","__drizzle_migrations");if(!t)process.exit(0);const r=s.prepare("select max(created_at) as m from __drizzle_migrations").get();if(r&&r.m!=null)process.stdout.write(String(r.m))' "$db"
          REMOTE
          )

          echo "target tag journal max: ${target:-<none>}"
          echo "database applied max:   ${applied:-<none>}"

          set +e
          reason=$(APPLIED_MAX="$applied" TARGET_MAX="$target" npx tsx scripts/migrationGuard.ts)
          code=$?
          set -e
          echo "$reason"

          # Exit 2 is a determinate mismatch; anything else non-zero means the
          # state couldn't be read, which force must never override.
          if [ "$code" -eq 2 ]; then
            if [ "${{ inputs.force_across_migrations }}" = "true" ]; then
              echo "::warning::Forcing across a schema mismatch. A pre-deploy snapshot is written to .data/backups/predeploy_<timestamp>.sqlite — restore the newest one from this run if the bot misbehaves."
            else
              echo "::error::Refusing to deploy ${{ inputs.tag }}. Re-run with force_across_migrations=true to override — see deploy/README.md first."
              exit 1
            fi
          elif [ "$code" -ne 0 ]; then
            echo "::error::Could not determine migration state; refusing to deploy."
            exit 1
          fi

      - name: Stage and rsync build to server
        run: |
          mkdir -p stage
          cp -r dist drizzle images deploy package.json package-lock.json NotoSansCJKjp-Regular.otf stage/
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}/incoming'"
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            stage/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/incoming/"

      - name: Stop service, back up DB, swap in build, restart
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          APP="${{ secrets.DEPLOY_PATH }}"
          sudo systemctl stop feed1 || true
          cd "$APP"
          rel=$(grep -E '^DB_PATH=' .env 2>/dev/null | tail -1 | cut -d= -f2- || true)
          rel=${rel:-.data/feed1.sqlite}
          case "$rel" in /*) DB="$rel" ;; *) DB="$APP/$rel" ;; esac
          if [ -f "$DB" ]; then
            mkdir -p "$APP/.data/backups"
            SNAP="$APP/.data/backups/predeploy_$(date +%Y%m%dT%H%M%S).sqlite"
            # VACUUM INTO, not cp: the service exits without closing the handle,
            # so committed frames can still be sitting in the -wal file.
            node -e 'const D=require("better-sqlite3");const db=new D(process.argv[1]);db.prepare("VACUUM INTO ?").run(process.argv[2]);db.close()' "$DB" "$SNAP"
            echo "pre-deploy snapshot: $SNAP"
          fi
          rsync -a --delete --exclude '.data' --exclude '.env' --exclude 'node_modules' --exclude 'incoming' "$APP/incoming/" "$APP/"
          cd "$APP"
          npm ci --omit=dev
          sudo systemctl start feed1
          sleep 5
          systemctl is-active feed1
          EOF

      # Only after the service is confirmed up, so a release always means a
      # deploy that came back healthy.
      - name: Create the GitHub Release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "${{ steps.release.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.sha }}"
